name: Client admission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hue-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Require one immutable Couch SDK revision
        run: |
          python3 - <<'PY'
          import pathlib, re
          manifest = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          revisions = re.findall(r'couch-(?:plugin|sdk).*?rev = "([0-9a-f]{40})"', manifest)
          assert revisions and len(set(revisions)) == 1, "SDK dependencies must share one full Git revision"
          PY
      - name: Refuse feed metadata until the package adapter exists
        run: |
          # The feed pins a repository by its integration.json. This repository
          # holds only the client; see docs/protocol-needs.md.
          test ! -e integration.json
          test ! -e plugin.json
      - run: cargo fmt -- --check
      - run: cargo test --locked --all-targets

  # ring compiles C and assembly, so unlike a TLS-free integration this crate
  # needs an ARM musl C compiler. Build it the way the feed does: the pinned
  # Couch revision's Zig wrapper for C, rust-lld for the link.
  armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - name: Check out Couch tooling at the pinned SDK revision
        run: |
          revision=$(python3 - <<'PY'
          import pathlib, re
          manifest = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          print(re.search(r'couch-sdk.*?rev = "([0-9a-f]{40})"', manifest).group(1))
          PY
          )
          git init -q "$RUNNER_TEMP/couch"
          git -C "$RUNNER_TEMP/couch" fetch -q --depth 1 https://github.com/Couch-OS/couch.git "$revision"
          git -C "$RUNNER_TEMP/couch" checkout -q FETCH_HEAD
      - name: Build the static ARMv7 client
        run: |
          source=$PWD
          cd "$RUNNER_TEMP/couch"
          tools/fetch-zig.sh
          . tools/arm-cc-env.sh
          cd "$source"
          cargo build --locked --release --target armv7-unknown-linux-musleabihf --bin couch-hue
          file target/armv7-unknown-linux-musleabihf/release/couch-hue | grep -q 'statically linked'
