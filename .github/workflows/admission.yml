name: Client admission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hue-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Require one immutable Couch SDK revision
        run: |
          python3 - <<'PY'
          import pathlib, re
          manifest = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          revisions = re.findall(r'couch-(?:plugin|sdk).*?rev = "([0-9a-f]{40})"', manifest)
          assert revisions and len(set(revisions)) == 1, "SDK dependencies must share one full Git revision"
          PY
      - name: Validate protocol 3 package metadata
        run: |
          python3 - <<'PY'
          import json, pathlib

          integration = json.loads(pathlib.Path("integration.json").read_text(encoding="utf-8"))
          plugin = json.loads(pathlib.Path("plugin.json").read_text(encoding="utf-8"))
          assert set(integration) == {
              "schema", "protocol_version", "id", "tier", "synthetic",
              "cargo_manifest", "cargo_package", "binary", "manifest",
          }, "integration.json has exactly the nine keys the feed reads"
          assert integration["protocol_version"] == 3, "integration.json must say protocol 3"
          assert plugin["protocol_version"] == 3, "plugin.json must say protocol 3"
          assert plugin["min_core_protocol_version"] == 3, \
              "min_core_protocol_version must equal the protocol version"
          assert integration["id"] == plugin["id"] == "hue"
          assert integration["manifest"] == "plugin.json"
          assert integration["binary"] == "couch-plugin-hue"
          assert plugin["executable"] == "bin/couch-plugin-hue"

          PY
      - run: cargo fmt -- --check
      - run: cargo test --locked --all-targets

  # ring compiles C and assembly, so unlike a TLS-free integration this crate
  # needs an ARM musl C compiler. Build it the way the feed does: the pinned
  # Couch revision's Zig wrapper for C, rust-lld for the link.
  armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - name: Check out Couch tooling at the pinned SDK revision
        run: |
          revision=$(python3 - <<'PY'
          import pathlib, re
          manifest = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          print(re.search(r'couch-sdk.*?rev = "([0-9a-f]{40})"', manifest).group(1))
          PY
          )
          git init -q "$RUNNER_TEMP/couch"
          git -C "$RUNNER_TEMP/couch" fetch -q --depth 1 https://github.com/Couch-OS/couch.git "$revision"
          git -C "$RUNNER_TEMP/couch" checkout -q FETCH_HEAD
      - name: Build the static ARMv7 package binary
        run: |
          source=$PWD
          cd "$RUNNER_TEMP/couch"
          tools/fetch-zig.sh
          . tools/arm-cc-env.sh
          cd "$source"
          cargo build --locked --release --target armv7-unknown-linux-musleabihf --bin couch-plugin-hue
          file target/armv7-unknown-linux-musleabihf/release/couch-plugin-hue | grep -q 'statically linked'
          ls -l target/armv7-unknown-linux-musleabihf/release/couch-plugin-hue
